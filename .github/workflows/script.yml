name: GitHub Script practice

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Thank the author
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: `🎉 Thanks @${issue.user.login} for opening "${issue.title}"!`
            })

      - name: Triage (script from a file)
        id: triage
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const triage = require('./.github/scripts/triage.js')
            return await triage({ github, context, core })

      - name: Use the result
        run: |
          echo "Issue classified as ${{ steps.triage.outputs.result }}"