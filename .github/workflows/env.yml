name: Env practice

on: workflow_dispatch

env:
  GREETING: Hello
  LEVEL: workflow

jobs:
  variables:
    runs-on: ubuntu-latest
    env:
      LEVEL: job
    steps:
      - name: Scopes and override
        env:
          NAME: Flash
        run: |
          echo "$GREETING $NAME"
          echo "LEVEL is $LEVEL"

      - name: Step override
        env:
          LEVEL: step
        run: |
          echo "LEVEL is $LEVEL"

      - name: Default variables vs contexts
        run: |
          echo "Shell   = $GITHUB_REF_NAME on $RUNNER_OS"
          echo "Context = ${{ github.ref_name }} on ${{ runner.os }}"

      - name: Set a value at run time
        run: |
          echo "BUILD_DATE=$(date +%F)" >> "$GITHUB_ENV"
          echo "In this same step BUILD_DATE is '$BUILD_DATE'"

      - name: Read it in a later step
        run: |
          echo "BUILD_DATE is $BUILD_DATE"

      - name: Repo variable and secret
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          echo "APP_NAME (vars) = ${{ vars.APP_NAME }}"
          echo "SERVER_URL without environment = '${{ vars.SERVER_URL }}'"
          echo "API_KEY = $API_KEY"
          echo "API_KEY length = ${#API_KEY}"

  deploy-staging:
    needs: variables
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        env:
          TARGET: staging
          APP_NAME: ${{ vars.APP_NAME }}
          SERVER_URL: ${{ vars.SERVER_URL }}
        run: |
          bash .github/scripts/deploy.sh

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://prod.example.com
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        env:
          TARGET: production
          APP_NAME: ${{ vars.APP_NAME }}
          SERVER_URL: ${{ vars.SERVER_URL }}
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          bash .github/scripts/deploy.sh
          echo "API_KEY = $API_KEY"
          echo "API_KEY length = ${#API_KEY}"